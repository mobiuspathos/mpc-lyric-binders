# Serves Binder Maker from this folder at http://localhost:8080, always fresh.
server {
    listen 80;
    root /usr/share/nginx/html;
    index binder-maker.html;
    sendfile off;                         # Docker Desktop can serve stale files with sendfile on
    add_header Cache-Control "no-store";  # every reload fetches the latest build
    location / {
        try_files $uri $uri/ =404;
    }
}
