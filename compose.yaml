# Run the tests:   docker compose run --rm test
# Make a PDF:      docker compose run --rm pdf examples/holiday-caroling.txt binder.pdf
# Booklet PDFs:    docker compose run --rm booklet-pdf examples/caroling-booklet.txt booklet-pdfs   (writes all three versions)
# Open the tool:   docker compose up -d web   then go to http://localhost:8080  (Booklet Maker: http://localhost:8080/booklet-maker.html; stop: docker compose down)
#                  It rebuilds binder-maker.html and booklet-maker.html when you save anything in src/. Reload the page to see it.
# Rebuild once:    docker compose run --rm build-html
# Convert old:     docker compose run --rm convert-legacy songs.txt out.txt   (songs.txt must be in this folder)
services:
  test:
    build: .
    image: mpc-binder-tools
    init: true
    ipc: host
    volumes:
      - .:/app               # use the files as they are on this computer right now
      - /app/node_modules    # but keep the installed packages from the image
  pdf:
    build: .
    image: mpc-binder-tools
    init: true
    ipc: host
    volumes:
      - .:/app
      - /app/node_modules
    entrypoint: ["node", "scripts/render-pdf.js"]
  booklet-pdf:
    build: .
    image: mpc-binder-tools
    init: true
    ipc: host
    volumes:
      - .:/app
      - /app/node_modules
    entrypoint: ["node", "scripts/render-booklet.js"]
  watch:
    build: .
    image: mpc-binder-tools
    init: true
    volumes:
      - .:/app
      - /app/node_modules
    entrypoint: ["node", "--watch-path=src", "scripts/build.js"]
  build-html:
    build: .
    image: mpc-binder-tools
    init: true
    volumes:
      - .:/app
      - /app/node_modules
    entrypoint: ["npm", "run", "build"]
  convert-legacy:
    build: .
    image: mpc-binder-tools
    init: true
    volumes:
      - .:/app
      - /app/node_modules
    entrypoint: ["node", "scripts/convert-legacy.js"]
  web:
    image: nginx:1.27-alpine
    depends_on: [watch]
    ports:
      - "127.0.0.1:8080:80"   # this Mac only
    volumes:
      - .:/usr/share/nginx/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
